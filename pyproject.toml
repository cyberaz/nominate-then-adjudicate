[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nominate-then-adjudicate"
version = "0.1.0.dev0"
description = "Research code for per-instance MIP solver configuration selection"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = [
  "numpy>=1.24", "scipy", "pyscipopt>=4.0", "xgboost>=2.0",
  "scikit-learn>=1.3", "pyyaml>=6.0", "tqdm>=4.65", "joblib>=1.3",
  "pandas>=2.0", "optuna>=3.0",
]

[project.optional-dependencies]
llm = ["openai>=1.0", "anthropic>=0.18"]
smac = ["smac", "ConfigSpace"]

[tool.setuptools.packages.find]
where = ["code/src"]
